name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: imgview
            asset_name: imgview-linux-amd64
          - os: macos-latest
            artifact_name: imgview
            asset_name: imgview-macos-amd64
            
    steps:
    - uses: actions/checkout@v4
    
    - name: Build
      run: make
      
    - name: Rename artifact
      run: |
        mv ${{ matrix.artifact_name }} ${{ matrix.asset_name }}
        
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ matrix.asset_name }}
        asset_name: ${{ matrix.asset_name }}
        tag: ${{ github.ref }}
        overwrite: true
